<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moderador de IAs</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style> pre { white-space: pre-wrap; word-break: break-word; } </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto py-10 px-4">
    <h1 class="text-3xl font-bold mb-6 text-center text-yellow-400">🧠 Moderador de IAs</h1>

    <textarea id="pergunta" placeholder="Digite sua pergunta aqui..." class="w-full p-3 rounded-lg bg-gray-800 text-white" rows="3"></textarea>

    <div class="flex gap-3 mt-3">
      <button id="btnPerguntar" class="bg-yellow-500 hover:bg-yellow-600 text-black font-semibold py-2 px-5 rounded-lg">Analisar</button>
      <button id="btnFalar" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg">🎤 Perguntar por voz</button>
    </div>

    <div id="loading" class="mt-5 text-yellow-400 hidden animate-pulse">⏳ Consultando as IAs...</div>

    <div class="mt-8 space-y-4">
      <div class="bg-gray-800 p-4 rounded-lg shadow"><h3 class="text-yellow-400 font-semibold">DeepSeek</h3><pre id="respDeepseek"></pre></div>
      <div class="bg-gray-800 p-4 rounded-lg shadow"><h3 class="text-yellow-400 font-semibold">Grok</h3><pre id="respGrok"></pre></div>
      <div class="bg-gray-800 p-4 rounded-lg shadow"><h3 class="text-yellow-400 font-semibold">Qwen3-Max</h3><pre id="respQwen"></pre></div>
      <div class="bg-gray-800 p-4 rounded-lg shadow"><h3 class="text-yellow-400 font-semibold">OpenRouter</h3><pre id="respOpenRouter"></pre></div>

      <div class="bg-yellow-100 text-gray-900 p-4 rounded-lg shadow">
        <h3 class="font-bold text-xl">🧩 Análise do Moderador</h3>
        <pre id="respAnalise"></pre>
      </div>

      <canvas id="chartConcordancia" width="400" height="120" class="mt-6"></canvas>
    </div>
  </div>

  <script>
    // 🎤 Reconhecimento de voz
    const recognizer = new(window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognizer.lang = "pt-BR";
    recognizer.onresult = (event) => {
      document.getElementById("pergunta").value = event.results[0][0].transcript;
    };
    document.getElementById("btnFalar").onclick = () => recognizer.start();

    // 🔊 Leitura de texto
    function lerAnalise(texto) {
      const synth = window.speechSynthesis;
      const fala = new SpeechSynthesisUtterance(texto);
      fala.lang = "pt-BR";
      synth.speak(fala);
    }

    // 📈 Atualiza gráfico
    function atualizarGrafico(valor) {
      new Chart(document.getElementById("chartConcordancia"), {
        type: 'bar',
        data: {
          labels: ["Concordância Geral"],
          datasets: [{
            label: "% de Concordância entre IAs",
            data: [valor],
            backgroundColor: valor > 60 ? "rgb(34,197,94)" : "rgb(234,179,8)"
          }]
        },
        options: { scales: { y: { beginAtZero: true, max: 100 } } }
      });
    }

    // 🚀 Envio da pergunta
    document.getElementById('btnPerguntar').addEventListener('click', async () => {
      const pergunta = document.getElementById('pergunta').value.trim();
      if (!pergunta) { alert("Digite uma pergunta"); return; }

      document.getElementById('loading').classList.remove('hidden');
      ["respDeepseek","respGrok","respQwen","respOpenRouter","respAnalise"].forEach(id => document.getElementById(id).textContent = "");

      const resp = await fetch('/analisar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pergunta })
      });

      const data = await resp.json();
      document.getElementById('loading').classList.add('hidden');

      document.getElementById('respDeepseek').textContent = data.respostas.deepseek || "Sem resposta";
      document.getElementById('respGrok').textContent = data.respostas.grok || "Sem resposta";
      document.getElementById('respQwen').textContent = data.respostas.qwen3_max || "Sem resposta";
      document.getElementById('respOpenRouter').textContent = data.respostas.openrouter || "Sem resposta";
      document.getElementById('respAnalise').textContent = data.analise || "Sem análise";
      atualizarGrafico(data.concordancia || 0);
      lerAnalise(data.analise || "");
    });
  </script>
</body>
</html>
